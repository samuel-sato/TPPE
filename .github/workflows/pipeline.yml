name : Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout code
        uses: actions/checkout@v3
        run: echo "Checking out the code"

      - name: Set up Node 
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
        run: echo "Node.js version set to ${{ env.NODE_VERSION }}"
